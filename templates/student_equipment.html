<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Equipment - SEMS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="navbar">
        <p class="brand">SEMS</p>
        <div>
            <a href="{{ url_for('student_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('student_logout') }}">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h1>All Equipment</h1>
            <table>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Status</th>
                </tr>
                {% for e in equipment %}
                <tr>
                    <td>{{ e.name }}</td>
                    <td>{{ sport_icon(e.category) }} {{ e.category }}</td>
                    <td><span class="badge {{ e.status }}">{{ e.status }}</span></td>
                </tr>
                {% else %}
                <tr><td colspan="3">No equipment available yet.</td></tr>
                {% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
