<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - SEMS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="navbar">
        <p class="brand">SEMS Admin</p>
        <div><a href="{{ url_for('index') }}">Home</a></div>
    </div>

    <div class="auth-wrap">
        <div class="auth-panel">
            <img src="{{ url_for('static', filename='img/hero-illustration.svg') }}" alt="Sport equipment illustration">
        </div>
        <div class="auth-form">
        <div class="card">
            <h1>Admin Login</h1>

            {% if error %}
            <p class="status-msg error">{{ error }}</p>
            {% endif %}

            <form method="post" action="{{ url_for('admin_login') }}">
                <label>Username</label>
                <input type="text" name="username" required autofocus>

                <label>Password</label>
                <input type="password" name="password" required>

                <button class="btn full" type="submit">Login</button>
            </form>
        </div>
        </div>
    </div>
</body>
</html>
